services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 3s
      retries: 30

  approvals-api:
    build: .
    command: ["uvicorn", "store_agent.approvals_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8088"]
    environment:
      DATABASE_URL: postgresql://store:store@db:5432/store
      APPROVER_API_KEY: ${APPROVER_API_KEY:-dev-approver-key}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
