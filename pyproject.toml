[project]
name = "store-agent-mcp"
version = "0.1.0"
description = "An MCP server that lets an AI agent work with a retail catalog, with human approval for writes and a tamper-evident audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastembed>=0.4",
    "httpx>=0.27",
]

[project.scripts]
store-agent-mcp = "store_agent.mcp_server:main"
store-agent-seed = "store_agent.seed:main"
store-agent-evals = "store_agent.evals:main"
store-agent-chat = "store_agent.agent:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["S", "B", "ASYNC", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
